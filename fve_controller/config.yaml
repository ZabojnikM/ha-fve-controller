name: FVE Controller
version: "0.7.0"
slug: fve_controller
url: https://github.com/ZabojnikM/ha-fve-controller
image: ghcr.io/zabojnikm/ha-fve-controller
description: Čtení FVE a Tesly, řízení čerpadla TUV; ohřev zůstává v Node-RED
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
options:
  pump_control_enabled: true
  pump_temperature_fresh_seconds: 120
  tesla_enabled: true
  tesla_fresh_seconds: 900
  tesla_entities:
    connected: binary_sensor.nabijeci_kabel
    soc: sensor.uroven_baterie
    charging: sensor.nabijeni
    current: sensor.proud_nabijecky
    power: sensor.vykon_nabijecky
    current_limit: number.nabijeci_proud
  ha_enabled: true
  ha_temperature_fresh_seconds: 900
  ha_entities:
    upper: sensor.tepla_voda
    lower: sensor.tuv_1
    pump: switch.kicony_kc868_a16_y04
    power: select.automatizace_kicony_vykon_tuv
    system: sensor.stav_systemu_tuv
    overload: binary_sensor.sonoff_4ch_button_1
    sensor_reset: switch.kicony_kc868_a16_y15
    uptime: sensor.esp_tuv_cas_behu
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_fresh_seconds: 60
  mqtt_topics:
    inverter: victron/N/c0619ab221ee/system/0/Ac/ConsumptionOnOutput/L1/Power
    grid_l1: victron/N/c0619ab221ee/system/0/Ac/Grid/L1/Power
    grid_l2: victron/N/c0619ab221ee/system/0/Ac/Grid/L2/Power
    grid_l3: victron/N/c0619ab221ee/system/0/Ac/Grid/L3/Power
    min_cell: victron/N/c0619ab221ee/battery/99/System/MinCellVoltage
    max_cell: ""
    soc: victron/N/c0619ab221ee/battery/278/Soc
    battery: victron/N/c0619ab221ee/battery/278/Dc/0/Power
    solar_roof: victron/N/c0619ab221ee/solarcharger/0/Yield/Power
    solar_shelter: victron/N/c0619ab221ee/solarcharger/278/Yield/Power
    solar_fence: victron/N/c0619ab221ee/solarcharger/1/Yield/Power
schema:
  pump_control_enabled: bool
  pump_temperature_fresh_seconds: int(30,900)
  tesla_enabled: bool
  tesla_fresh_seconds: int(30,86400)
  tesla_entities:
    connected: str
    soc: str
    charging: str
    current: str
    power: str
    current_limit: str
  ha_enabled: bool
  ha_temperature_fresh_seconds: int(30,86400)
  ha_entities:
    upper: str
    lower: str
    pump: str
    power: str
    system: str
    overload: str
    sensor_reset: str
    uptime: str
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_fresh_seconds: int(5,3600)
  mqtt_topics:
    inverter: str
    grid_l1: str
    grid_l2: str
    grid_l3: str
    min_cell: str
    max_cell: str
    soc: str
    battery: str
    solar_roof: str
    solar_shelter: str
    solar_fence: str
homeassistant_api: true
hassio_api: false
